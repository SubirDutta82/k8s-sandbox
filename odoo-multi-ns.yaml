apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-db-pvc
  namespace: database
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-postgres
  namespace: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    
      containers:
      - name: postgres
        image: postgres:15-alpine
        envFrom:
        - secretRef:
            name: postgres-credentials
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: postgres-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-postgres
  namespace: database
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
    spec:
      containers:
      - name: odoo
        image: odoo:17.0
        ports:
        - containerPort: 8069
        env:
        - name: HOST
          value: enterprise-postgres.database.svc.cluster.local
        - name: USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        # NOTE: the official odoo image's entrypoint only reads HOST, USER,
        # PASSWORD, PORT from the environment — it does NOT read a "DB_NAME"
        # variable, so setting one has no effect. To actually pre-select a
        # database and skip the Database Manager screen, pass it as a CLI
        # arg via `--database` (Odoo's real supported mechanism for this).
        args: ["--database=odoo"]
        readinessProbe:
          httpGet:
            path: /web/login
            port: 8069
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 50
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /web/login
            port: 8069
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1536Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: odoo-service
  namespace: apps
spec:
  ports:
  - port: 8069
    targetPort: 8069
  selector:
    app: odoo
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: apps-quota
  namespace: apps
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 4Gi
